# Sol.reply_sanitizer 默认配置
# 挂载点：maisaka.reply.before_post_process（只改写 response 字段）

[plugin]
enabled = true
config_version = "1.0.0"

[strip]
# 移除 <think>/<thinking>/<thought>/<reasoning> 等标签块及其中的推理文字
strip_tags = true
# 移除回复开头的思考标记 emoji
strip_decorations = true
decoration_chars = "🧠💭🫧"
# 正文开头的方括号占位标记（模型偶尔自行写出），多个用英文逗号分隔；留空则关闭
leading_markers = "[::]"
# 正文开头单独成词的推理标签词（thought / thinking / analysis 等）
strip_reason_words = true
# 已知伪标记与整条双角括号包装
strip_artifacts = true
# 明确中文分析标题，无最终回复分界则拦截整条；不受 preamble.mode 控制
strip_chinese_analysis = true
# 文本 emoji 过滤；表情包图片不在处理范围
strip_emoji = true
# 代码之外的 Unicode 私用区字符
strip_private_use = true

[preamble]
# off | heuristic | always
# heuristic: 仅当本次确实剥离到标签或装饰标记时才尝试切前言，避免误伤正常外文回复
mode = "heuristic"
min_cjk_ratio = 0.5
max_cut_chars = 1500

[log]
enabled = true
